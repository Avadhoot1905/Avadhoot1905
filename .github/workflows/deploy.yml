name: Deploy Static Site to S3

on:
  push:
    branches:
      - main

  # Weekly deploy (Sunday 2 AM UTC)
  schedule:
    - cron: "0 2 * * 0"

  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js (Static Export)
        run: npm run build

      - name: Verify out directory exists
        run: ls -la out

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      # Pass 1 — content-hashed, immutable assets (everything except the entry
      # documents). These filenames change on every build, so a 1-year immutable
      # cache is correct and optimal. --delete prunes old hashed chunks.
      - name: Sync hashed static assets to S3 (immutable, remove old files)
        run: |
          aws s3 sync out/ s3://avadhootgmportfolio \
            --delete \
            --cache-control "public, max-age=31536000, immutable" \
            --exclude "*.html" \
            --exclude "*.txt" \
            --exclude "data/*.json"

      # Pass 2 — entry documents (HTML + Next.js route payload .txt + runtime
      # data JSON). These have STABLE names and reference the hashed assets, so
      # they must be revalidated on every visit. Without this they inherited the
      # immutable policy above, meaning a returning browser could serve a stale
      # index.html pointing at chunks that --delete already removed (broken load).
      - name: Sync entry documents to S3 (always revalidate)
        run: |
          aws s3 sync out/ s3://avadhootgmportfolio \
            --exclude "*" \
            --include "*.html" \
            --include "*.txt" \
            --include "data/*.json" \
            --cache-control "public, no-cache, must-revalidate"

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id EE5QPSJYDEMEA \
            --paths "/*"